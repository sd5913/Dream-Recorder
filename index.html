<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dream Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Newsreader:ital,wght@1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="entry-open">
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="cv" aria-hidden="true" data-i18n-aria="aCanvas" aria-label="由梦境文字组成的图像"></canvas>
<main id="entry" aria-labelledby="entryTitle">
  <button type="button" class="tbtn" id="entryLang" data-i18n="tLang" title="English / 中文">EN</button>
  <div class="entry-content" id="entryChoices">
    <h1 id="entryTitle">Dream Recorder</h1>
    <p class="entry-prompt" data-i18n="entryPrompt">选择进入方式</p>
    <button type="button" class="entry-action entry-primary" id="entryLogin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1C5.92 1 1 5.92 1 12c0 4.87 3.15 9 7.52 10.46.55.1.75-.24.75-.53v-2.05c-3.06.66-3.71-1.3-3.71-1.3-.5-1.27-1.22-1.6-1.22-1.6-1-.69.08-.68.08-.68 1.1.08 1.69 1.13 1.69 1.13.98 1.69 2.58 1.2 3.21.92.1-.71.38-1.2.7-1.47-2.44-.28-5.01-1.22-5.01-5.44 0-1.2.43-2.18 1.13-2.95-.12-.28-.49-1.4.11-2.91 0 0 .92-.29 3.03 1.13a10.5 10.5 0 0 1 5.5 0c2.1-1.42 3.02-1.13 3.02-1.13.6 1.51.23 2.63.12 2.91.7.77 1.12 1.75 1.12 2.95 0 4.23-2.57 5.16-5.02 5.43.4.35.75 1.02.75 2.05v3.01c0 .3.2.64.76.53A11 11 0 0 0 23 12c0-6.08-4.92-11-11-11Z"/></svg>
      <span data-i18n="entryLogin">使用 GitHub 登录</span>
    </button>
    <button type="button" class="entry-action" id="entryGuest" data-i18n="entryGuest">以游客身份进入</button>
  </div>
  <section id="githubSignIn" aria-labelledby="githubSignInTitle" hidden>
    <div class="signin-brand brand">Dream Recorder</div>
    <div class="signin-content">
      <h1 id="githubSignInTitle" data-i18n="entryLogin" tabindex="-1">使用 GitHub 登录</h1>
      <p data-i18n="githubSignInHelp">选择 GitHub 账号，打开你的云端档案。</p>
      <button type="button" class="entry-action entry-primary" id="githubContinue" data-i18n="githubContinue">继续前往 GitHub</button>
      <button type="button" class="entry-action" id="githubBack" data-i18n="githubBack">返回选择进入方式</button>
      <p id="entryStatus" class="entry-status" role="status"></p>
    </div>
  </section>
</main>
<div id="ui" inert>
  <div id="top">
    <div class="brand">Dream Recorder</div>
    <div class="tools">
      <a class="tbtn" id="btnLogin" href="/api/auth/github" data-i18n="accountLogin" hidden>GitHub 登录</a>
      <button class="tbtn" id="btnSound" aria-pressed="false" data-i18n-title="tSound" title="梦境音景"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg><span id="sndLab">声音</span></button>
      <button class="tbtn" id="btnArch" data-i18n-title="tArch" title="梦境档案"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg><span data-i18n="archive">档案</span> <span class="n" id="archN">0</span></button>
      <button class="tbtn" id="btnSave" data-i18n-title="tSave" data-i18n-aria="tSave" title="保存为图片" aria-label="保存为图片"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>
      <button class="tbtn" id="btnLang" data-i18n="tLang" title="English / 中文">EN</button>
      <button type="button" class="tbtn" id="btnAccount" popovertarget="accountPanel" data-i18n-aria="accountDetails" data-i18n-title="accountDetails" aria-label="账号详情" title="账号详情" hidden>
        <span class="account-avatar" id="accountBadge" aria-hidden="true">G</span>
      </button>
      <section id="accountPanel" popover aria-labelledby="accountTitle">
        <h2 id="accountTitle" data-i18n="accountDetails">账号详情</h2>
        <div class="account-identity">
          <span class="account-avatar" id="accountAvatar" aria-hidden="true">G</span>
          <div><p id="accountName"></p><p id="accountId"></p></div>
        </div>
        <a class="tbtn" id="accountProfile" target="_blank" rel="noopener noreferrer" data-i18n="accountProfile" hidden>查看 GitHub 主页</a>
        <button type="button" class="tbtn" id="btnLogout" data-i18n="accountLogout">退出</button>
      </section>
    </div>
  </div>
  <div id="cap" aria-live="polite"></div>
  <section id="dock">
    <div class="row" id="samples"><span class="lab" data-i18n="samples">示例</span></div>
    <div class="row" id="emos" role="group" data-i18n-aria="aEmo" aria-label="梦里的情绪"><span class="lab" data-i18n="emotion">情绪</span></div>
    <form id="form" autocomplete="off">
      <textarea id="inp" rows="1" data-i18n-ph="placeholder" placeholder="写下你的梦…" enterkeyhint="send"></textarea>
      <button type="button" class="sq" id="mic" aria-pressed="false" data-i18n-title="tMic" title="语音输入" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg></button>
      <button type="submit" id="go" data-i18n="go">生成</button>
    </form>
  </section>
</div>
<aside id="arch" hidden>
  <header><h2 data-i18n="archTitle">梦境档案</h2>
    <button class="tbtn" id="btnImport" hidden>导入本机档案</button>
    <div class="views" role="group"><button class="tbtn" id="viewSky" aria-pressed="true" data-i18n="viewSky">星空</button><button class="tbtn" id="viewList" aria-pressed="false" data-i18n="viewList">列表</button></div>
    <button class="tbtn" id="archClose" data-i18n="close">关闭</button></header>
  <div id="sky" hidden><canvas id="skyc" tabindex="0" role="img"></canvas></div>
  <div id="skyInfo" hidden></div>
  <div id="grid"></div>
  <p id="cloudStatus" role="status"></p>
</aside>
<dialog id="communityPublish" class="publish-dialog" aria-labelledby="publishTitle">
  <header>
    <h2 id="publishTitle"></h2>
    <button type="button" class="tbtn" id="publishClose" data-i18n="close">关闭</button>
  </header>
  <p id="publishStatus" role="status"></p>
  <div id="publishBody"></div>
</dialog>
<div id="toast" role="status"></div>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/emotion.js"></script>
<script src="js/geometry.js"></script>
<script src="js/scenes/sky.js"></script>
<script src="js/scenes/world.js"></script>
<script src="js/scenes/things.js"></script>
<script src="js/scenes/animals.js"></script>
<script src="js/scenes/icons.js"></script>
<script src="js/scenes/objects.js"></script>
<script src="js/scenes/typical.js"></script>
<script src="js/symbols.js"></script>
<script src="js/tarot.js"></script>
<script src="js/compose.js"></script>
<script src="js/words.js"></script>
<script src="js/particles.js"></script>
<script src="js/canvas.js"></script>
<script src="js/bg.js"></script>
<script src="js/sound.js"></script>
<link rel="stylesheet" href="css/community-publish.css">
<script src="js/archive.js"></script>
<script src="js/community-publish.js"></script>
<script src="js/sky.js"></script>
<script src="js/export.js"></script>
<script src="js/misses.js"></script>
<script src="js/dream.js"></script>
<script src="js/pointer.js"></script>
<script src="js/loop.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/demo.js"></script>
<script src="js/cloud.js"></script>
</body>
</html>
