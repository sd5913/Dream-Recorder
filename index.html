<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dream Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Newsreader:ital,wght@1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv" aria-label="由梦境文字组成的图像"></canvas>
<div id="ui">
  <div id="top">
    <div class="brand">Dream Recorder</div>
    <div class="tools">
      <button class="tbtn" id="btnSound" aria-pressed="false" title="梦境音景"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg><span id="sndLab">声音</span></button>
      <button class="tbtn" id="btnArch" title="梦境档案"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg>档案 <span class="n" id="archN">0</span></button>
    </div>
  </div>
  <div id="cap" aria-live="polite"></div>
  <section id="dock">
    <div class="row" id="samples"><span class="lab">示例</span></div>
    <div class="row" id="emos" role="group" aria-label="梦里的情绪"><span class="lab">情绪</span></div>
    <form id="form" autocomplete="off">
      <textarea id="inp" rows="1" placeholder="写下你的梦…" enterkeyhint="send"></textarea>
      <button type="button" class="sq" id="mic" aria-pressed="false" title="语音输入" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg></button>
      <button type="submit" id="go">生成</button>
    </form>
  </section>
</div>
<aside id="arch" hidden>
  <header><h2>梦境档案</h2><button class="tbtn" id="archClose">关闭</button></header>
  <div id="grid"></div>
</aside>
<div id="toast" role="status"></div>
<script src="js/core.js"></script>
<script src="js/emotion.js"></script>
<script src="js/geometry.js"></script>
<script src="js/scenes/sky.js"></script>
<script src="js/scenes/world.js"></script>
<script src="js/scenes/things.js"></script>
<script src="js/compose.js"></script>
<script src="js/words.js"></script>
<script src="js/particles.js"></script>
<script src="js/canvas.js"></script>
<script src="js/sound.js"></script>
<script src="js/archive.js"></script>
<script src="js/dream.js"></script>
<script src="js/pointer.js"></script>
<script src="js/loop.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
